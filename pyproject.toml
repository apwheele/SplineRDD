[project]
name = "splinerdd"
version = "0.1.0"
description = "Splines versus kernel estimators for regression discontinuity designs"
readme = "README.md"
authors = [
    { name = "apwheele", email = "apwheele@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "rdrobust>=2.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.14.4",
    "tabulate>=0.10.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
